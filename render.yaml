services:
  - type: web
    name: opcit-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Pin Python: Render's default is 3.14, which has no faiss-cpu wheels
      # and broke other builds. The backend is built and tested on 3.12.
      - key: PYTHON_VERSION
        value: 3.12.0
      # Update with your Vercel frontend URL once deployed, comma-separated with localhost
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://YOUR-APP.vercel.app
      # Hugging Face token is set manually in the Render dashboard and never committed
      - key: HUGGINGFACEHUB_API_TOKEN
        sync: false
