# Tech precise theme: very dark green-tinted ink, one signal green accent.
# Base is green-tinted (not pure near-black) so the glass panels always have
# a hint of colour behind them; the CSS aurora layers do the heavy lifting.
[theme]
base = "dark"
primaryColor = "#3DF5A8"
backgroundColor = "#0A100D"
secondaryBackgroundColor = "#0E1712"
textColor = "#D8DDE3"
font = "sans serif"
